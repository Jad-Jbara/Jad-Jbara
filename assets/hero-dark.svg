<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 552" width="880" height="552" fill="none" role="img" aria-labelledby="h">
<title id="h">Jad Jbara — I build the app, the web app, and the services under both. A browser window charting data with a phone in front of it presenting a bottom sheet, over a frame-time graph held under the 16.6 millisecond budget.</title>
