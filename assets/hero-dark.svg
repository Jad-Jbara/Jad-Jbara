<style><![CDATA[
  .n{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#FAFAFA;font-weight:640;letter-spacing:-.03em}
  .l{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#8B8B95;font-size:17px}
  .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;fill:#8B8B95;font-size:11px;letter-spacing:.09em}
  .s{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;fill:#8B8B95;font-size:9.5px;letter-spacing:.05em}
  .si{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;fill:#FAFAFA;font-size:9.5px;letter-spacing:.05em}

  /* base state is the finished state, so a still render is always correct */
  .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 9s cubic-bezier(0.16, 1, 0.3, 1) infinite}
  @keyframes grow{0%,4%{transform:scaleY(.04)}22%,100%{transform:scaleY(1)}}
  .b0{animation-delay:0.000s}.b1{animation-delay:0.045s}.b2{animation-delay:0.090s}.b3{animation-delay:0.135s}.b4{animation-delay:0.180s}.b5{animation-delay:0.225s}.b6{animation-delay:0.270s}.b7{animation-delay:0.315s}.b8{animation-delay:0.360s}.b9{animation-delay:0.405s}.b10{animation-delay:0.450s}
  .row{animation:enter 9s cubic-bezier(0.16, 1, 0.3, 1) infinite}
  .r2{animation-delay:.06s}.r3{animation-delay:.12s}.r4{animation-delay:.18s}.r5{animation-delay:.24s}
  @keyframes enter{0%,7%{opacity:0;transform:translateY(6px)}16%,100%{opacity:1;transform:translateY(0)}}
  .sheet{animation:present 9s infinite}
  @keyframes present{
    0%,36%{transform:translateY(164px);animation-timing-function:cubic-bezier(0.16, 1, 0.3, 1)}
    45%,74%{transform:translateY(0);animation-timing-function:cubic-bezier(.7,0,.84,0)}
    83%,100%{transform:translateY(164px)}}
  .scrim{animation:dim 9s infinite}
  @keyframes dim{0%,36%{opacity:0}45%,74%{opacity:.58}83%,100%{opacity:0}}
  .trace{animation:scroll 15s linear infinite}
  @keyframes scroll{to{transform:translateX(-576px)}}
  .tick{opacity:0;animation:tick 3.6s steps(1) infinite}
  @keyframes tick{0%,16.6%{opacity:1}16.7%,100%{opacity:0}}
  .t0{animation-delay:0.0s}.t1{animation-delay:0.6s}.t2{animation-delay:1.2s}.t3{animation-delay:1.8s}.t4{animation-delay:2.4s}.t5{animation-delay:3.0s}
  .dot{animation:pulse 3.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){
    .bar,.row,.sheet,.scrim,.trace,.dot{animation:none}
    .scrim{opacity:.58}.tick{animation:none;opacity:0}.t0{opacity:1}}
]]></style>
